

<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Language" content="zh-cn">
    <meta name="apple-mobile-web-app-capable" content="no"/>
    <meta name="apple-touch-fullscreen" content="yes"/>
    <meta name="format-detection" content="telephone=no,email=no"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1"/>
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>扫码支付</title>
    <link href="pay.css?v=20260724" rel="stylesheet" media="screen">
</head>

<body>
<div class="body" id="body">
    <h1 class="mod-title">

        <span class="ico_log ico-1" id="wechatLogo" style="display:none"></span>
        <span class="ico_log ico-2" id="alipayLogo" style="display:none"></span>

    </h1>

    <div class="mod-ct">
        <div class="order">
        </div>
        <div class="amount" id="timeOut" style="font-size: 20px;color: red;display: none;"><p>订单已过期，请您返回网站重新发起支付</p><br></div>
        <div id="orderbody">
            <div class="amount" id="money"></div>
            <div class="qrcode-img-wrapper" data-role="qrPayImgWrapper">
                <div data-role="qrPayImg" class="qrcode-img-area">
                    <div class="ui-loading qrcode-loading" data-role="qrPayImgLoading" style="display: none;">加载中</div>
                    <div style="position: relative;display: inline-block;">
                        <img id="show_qrcode" alt="加载中..." width="210" height="210" style="display: block;">
                        <!--<img onclick="$('#use').hide()" id="use" src="use_1.png" v-if="payType==1"
                             style="position: absolute;top: 50%;left: 50%;width:32px;height:32px;margin-left: -16px;margin-top: -16px">
                        <img onclick="$('#use').hide()" id="use" src="use_2.png" v-if="payType==2"
                             style="position: absolute;top: 50%;left: 50%;width:32px;height:32px;margin-left: -16px;margin-top: -16px">-->
                    </div>
                </div>


            </div>
            <div class="time-item">


                <div class="time-item" id="msg">
                    <h1 id="priceNotice" style="display:none">
                        <span style="color:red">为了您正常支付 请务必付款 <span id="noticePrice"></span> 元 <br>备注说明无需填写</span><br>
                    </h1>

                </div>







                <strong id="hour_show">0时</strong>
                <strong id="minute_show">0分</strong>
                <strong id="second_show">0秒</strong>
            </div>

            <div class="tip">
                <div class="ico-scan"></div>
                <div class="tip-text">
                    <p>请使用<span class="payTypeName"></span>扫一扫</p>

                    <p id="fixedQrTip" style="display:none">扫描二维码完成支付</p>
                    <p id="autoQrTip" style="display:none">扫码后输入金额支付</p>

                </div>
            </div>

            <div class="detail" id="orderDetail">
                <dl class="detail-ct" id="desc" style="display: none;">
                    <dt>金额</dt>
                    <dd id="detailPrice"></dd>
                    <dt>商户订单：</dt>
                    <dd id="detailPayId"></dd>
                    <dt>创建时间：</dt>
                    <dd id="detailDate"></dd>
                    <dt>状态</dt>
                    <dd>等待支付</dd>
                </dl>

                <a href="javascript:void(0)" class="arrow" onclick="aaa()"><i class="ico-arrow"></i></a>
            </div>
        </div>


        <div class="tip-text">

        </div>


    </div>
    <div class="foot">
        <div class="inner">
            <p>手机用户可保存上方二维码到手机中</p>
            <p>在<span class="payTypeName"></span>扫一扫中选择“相册”即可</p>
        </div>
    </div>

</div>
<div class="copyRight">

</div>

<script>
    window.aaa = function () {
        var orderDetail = document.getElementById('orderDetail');
        var detail = orderDetail.querySelector('.detail-ct');
        var open = orderDetail.classList.toggle('detail-open');
        detail.style.display = open ? 'block' : 'none';
    }

    function formatDate(now) {
        now = new Date(now)
        return now.getFullYear()
            + "-" + (now.getMonth()>8?(now.getMonth()+1):"0"+(now.getMonth()+1))
            + "-" + (now.getDate()>9?now.getDate():"0"+now.getDate())
            + " " + (now.getHours()>9?now.getHours():"0"+now.getHours())
            + ":" + (now.getMinutes()>9?now.getMinutes():"0"+now.getMinutes())
            + ":" + (now.getSeconds()>9?now.getSeconds():"0"+now.getSeconds());

    }
    var myTimer;
    function timer(secondsRemaining) {
        var deadline = Date.now() + Math.max(0, secondsRemaining) * 1000;
        function render() {
            var totalSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
            var hour = Math.floor(totalSeconds / 3600);
            var minute = Math.floor((totalSeconds % 3600) / 60);
            var second = totalSeconds % 60;
            document.getElementById('hour_show').textContent = hour + '时';
            document.getElementById('minute_show').textContent = String(minute).padStart(2, '0') + '分';
            document.getElementById('second_show').textContent = String(second).padStart(2, '0') + '秒';
            if (totalSeconds === 0) {
                qrcode_timeout();
                window.clearInterval(myTimer);
            }
        }
        render();
        myTimer = window.setInterval(render, 1000);
    }

    function qrcode_timeout(){
        document.getElementById("orderbody").style.display = "none";
        document.getElementById("timeOut").style.display = "";
    }

    function post(path, values) {
        return fetch(path, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
            body: new URLSearchParams(values).toString(),
            credentials: 'same-origin'
        }).then(function (response) {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        });
    }

    function renderOrder(order) {
        var typeName = order.payType === 1 ? '微信' : '支付宝';
        document.getElementById(order.payType === 1 ? 'wechatLogo' : 'alipayLogo').style.display = '';
        document.getElementById('money').textContent = '￥' + order.reallyPrice;
        document.getElementById('show_qrcode').src = '/enQrcode?url=' + encodeURIComponent(order.payUrl);
        document.getElementById('fixedQrTip').style.display = order.isAuto === 0 ? '' : 'none';
        document.getElementById('autoQrTip').style.display = order.isAuto === 1 ? '' : 'none';
        document.getElementById('detailPrice').textContent = order.price;
        document.getElementById('detailPayId').textContent = order.payId;
        document.getElementById('detailDate').textContent = formatDate(order.date);
        Array.prototype.forEach.call(document.querySelectorAll('.payTypeName'), function (element) {
            element.textContent = typeName;
        });
        if (Number(order.price) !== Number(order.reallyPrice)) {
            document.getElementById('noticePrice').textContent = order.reallyPrice;
            document.getElementById('priceNotice').style.display = '';
        }
    }

    var orderId = new URLSearchParams(window.location.search).get('orderId');
    post('/getOrder', {orderId: orderId || ''}).then(function (data) {
        if (data.code !== 1) {
            timer(0);
            return;
        }
        var order = data.data;
        renderOrder(order);
        var elapsed = (Date.now() - order.date) / 1000;
        var remaining = order.state === -1 ? 0 : order.timeOut * 60 - elapsed;
        timer(remaining);
        check();
    }).catch(function () {
        timer(0);
    });

    function check() {
        post('/checkOrder', {orderId: orderId || ''}).then(function (data) {
            if (data.code == 1){
                window.location.href = data.data;
            } else if (data.data === '订单已过期') {
                qrcode_timeout();
                window.clearInterval(myTimer);
            } else {
                window.setTimeout(check, 1500);
            }
        }).catch(function () {
            window.setTimeout(check, 3000);
        });
    }

</script>
</body>
</html>
