<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>后台管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <link rel="stylesheet" href="layui/css/layui.css?v=20260724" media="all">
    <link rel="stylesheet" href="css/global.css?v=20260724" media="all">
    <style type="text/css">ins.adsbygoogle{display:none!important;display:none}</style></head>
<body>
<div class="layui-layout layui-layout-admin">
    <div class="layui-header header header-demo" summer>
        <div class="layui-main">
            <span style="color: white;font-size: 30px;font-weight:100;line-height: 58px;font-family:Microsoft JhengHei">后台管理</span>

            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item">
                    <a href="javascript:;">
                      
                        管理员
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:;" id="logout">退出</a></dd>
                    </dl>
                </li>
                <!-- <li class="layui-nav-item"><a href="">退出</a></li> -->
            </ul>
        </div>
    </div>
    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">

            <ul class="layui-nav layui-nav-tree site-demo-nav" id="v_menu">

            </ul>

        </div>
    </div>
        <div class="layui-body layui-tab-content site-demo site-demo-body">
            <div class="layui-tab-item layui-show">
                <div class="layui-main">
                    <div id="LAY_preview">






                        





                    </div>
                </div>
            </div>


        </div>
    </div>
    <div class="site-tree-mobile layui-hide" style="opacity: 0.4;">
        <i class="layui-icon">&#xe602;</i>
    </div>
    <div class="site-mobile-shade"></div>
    <script src="layui/layui.all.js?v=20260724" charset="utf-8"></script>
</div>
<script>
    layui.use(['jquery', 'layer', 'element'], function(){
        window.jQuery = window.$ = layui.$;
        var $ = window.$;
        var element = layui.element;
        var setIframe = function(){
            var height = $(window).height() - 370;
            $('#demoAdmin').height(height);
        };

        setIframe();
        $(window).on('resize', setIframe);

        function pageLink(item) {
            var link = $('<a href="javascript:;"></a>').text(item.name);
            link.on('click', function () {
                $('#LAY_preview').load(item.url);
            });
            return link;
        }

        function renderMenu(data) {
            var menu = $('#v_menu').empty();
            data.forEach(function (item) {
                var row = $('<li class="layui-nav-item"></li>');
                if (item.type === 'menu') {
                    row.addClass('layui-nav-itemed');
                    row.append($('<a href="javascript:;"></a>').text(item.name));
                    var children = $('<dl class="layui-nav-child"></dl>');
                    item.node.forEach(function (child) {
                        children.append($('<dd></dd>').append(pageLink(child)));
                    });
                    row.append(children);
                } else {
                    row.append(pageLink(item));
                }
                menu.append(row);
            });
            element.render('nav');
        }

        $('#LAY_preview').load('main.html?v=20260724');
        $.post('/admin/getMenu')
            .done(function (data) {
                if (!data || !data.length) {
                    window.location.href = '/';
                    return;
                }
                renderMenu(data);
            })
            .fail(function () {
                window.location.href = '/';
            });

        $('#logout').on('click', function () {
            $.post('/logout').always(function () {
                window.location.href = '/';
            });
        });
    });
</script>
</body>
</html>
