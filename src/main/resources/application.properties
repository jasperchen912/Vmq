server.port=8080

# 反向代理、压缩与会话
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.servlet.session.timeout=${VMQ_SESSION_TIMEOUT:8h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${VMQ_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.persistent=true
server.servlet.session.store-dir=${VMQ_SESSION_STORE_DIR:${user.home}/.vmq/sessions}

# H2 数据库基础配置
spring.datasource.url=${VMQ_DATASOURCE_URL:jdbc:h2:~/mq}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_updates=true

# H2 数据库控制台
spring.h2.console.settings.web-allow-others=false
spring.h2.console.path=/h2-console
spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 定时任务和外部回调
vmq.scheduler.enabled=true
vmq.orders.cleanup-delay=30s
vmq.orders.cleanup-initial-delay=30s
