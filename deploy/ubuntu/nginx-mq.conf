# Add these two server blocks inside the existing `http { ... }` block on
# mori-prod. The shared TLS certificate and origin-verification maps are
# inherited from the surrounding gateway configuration.

server {
    listen 127.0.0.1:18080;
    server_name mq.love-nancy.cn;

    if ($mori_origin_verified = 0) {
        return 403;
    }

    return 301 https://mq.love-nancy.cn$request_uri;
}

server {
    listen 127.0.0.1:18443 ssl;
    listen [::]:38443 ssl;
    server_name mq.love-nancy.cn;

    if ($mori_origin_verified = 0) {
        return 403;
    }

    # Vmq sets no-store for APIs, no-cache for HTML, and a seven-day cache for
    # versioned local assets. Do not overwrite those response headers here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $mori_edge_client_ip;
        proxy_set_header X-Forwarded-For $mori_edge_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Mori-Origin-Token "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header EO-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mori_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
