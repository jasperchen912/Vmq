services:
  vmq:
    image: ${VMQ_IMAGE:-vmq:modernized}
    container_name: vmq
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx448m -XX:+ExitOnOutOfMemoryError -Dvmq.http.connect-timeout-seconds=5 -Dvmq.http.request-timeout-seconds=30"
      VMQ_DATASOURCE_URL: "jdbc:h2:/data/mq"
      VMQ_SESSION_STORE_DIR: "/data/sessions"
      VMQ_SESSION_TIMEOUT: "8h"
      VMQ_SESSION_COOKIE_SECURE: "true"
    volumes:
      - vmq_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 640m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mori-vmq-internal

volumes:
  vmq_data:
    name: vmq_data

networks:
  mori-vmq-internal:
    external: true
    name: mori-vmq-internal
