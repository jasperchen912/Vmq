services:
  vmq:
    image: vmq:3d07c01
    container_name: vmq
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
    volumes:
      - vmq_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    networks:
      - mori-vmq-internal

volumes:
  vmq_data:
    name: vmq_data

networks:
  mori-vmq-internal:
    external: true
    name: mori-vmq-internal
