.arm64_pipeline: &arm64_pipeline
  runner:
    tags: cnb:arch:arm64:v8
    cpus: 4
  services:
    - docker
  docker:
    volumes:
      - main:/root/.m2:copy-on-write

vmq:
  push:
    - <<: *arm64_pipeline
      name: build-vmq-immutable-release
      stages:
        - name: verify source and run tests
          image: maven:3.9.11-eclipse-temurin-17@sha256:e4a7ace3dc0d645ed97f8d9ad0b0d3f0b14fa8d150138f27f116d7105a639b82
          timeout: 30m
          script: |
            set -eu
            repo_root=$(git rev-parse --show-toplevel)
            repo_root=$(CDPATH= cd "$repo_root" && pwd -P)
            cd "$repo_root"
            test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CNB_COMMIT"
            test -z "$(git status --porcelain)"
            mvn -B test

        - name: build publish and package ARM64 images
          timeout: 60m
          script: |
            set -eu
            umask 022
            repo_root=$(git rev-parse --show-toplevel)
            repo_root=$(CDPATH= cd "$repo_root" && pwd -P)
            cd "$repo_root"
            test "$(git rev-parse --verify 'HEAD^{commit}')" = "$CNB_COMMIT"

            output_dir=.cnb-release-out
            test ! -e "$output_dir"
            mkdir -m 0755 "$output_dir"

            image_prefix="$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE/vmq"
            app_image="$image_prefix/app:$CNB_COMMIT"
            migrator_image="$image_prefix/h2-migrator:$CNB_COMMIT"
            architecture=linux/arm64

            docker build \
              --pull \
              --build-arg "VCS_REF=$CNB_COMMIT" \
              --label "org.opencontainers.image.source=https://github.com/jasperchen912/Vmq" \
              --tag "$app_image" \
              .
            docker build \
              --pull \
              --build-arg "VCS_REF=$CNB_COMMIT" \
              --label "org.opencontainers.image.source=https://github.com/jasperchen912/Vmq" \
              --file deploy/ubuntu/h2-migrator.Dockerfile \
              --tag "$migrator_image" \
              .

            test "$(docker image inspect "$app_image" --format '{{.Architecture}}')" = arm64
            test "$(docker image inspect "$migrator_image" --format '{{.Architecture}}')" = arm64
            test "$(docker image inspect "$app_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CNB_COMMIT"
            test "$(docker image inspect "$migrator_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CNB_COMMIT"

            docker push "$app_image"
            docker push "$migrator_image"

            app_id=$(docker image inspect "$app_image" --format '{{.Id}}')
            migrator_id=$(docker image inspect "$migrator_image" --format '{{.Id}}')
            app_digest=$(docker image inspect "$app_image" --format '{{join .RepoDigests ","}}')
            migrator_digest=$(docker image inspect "$migrator_image" --format '{{join .RepoDigests ","}}')
            build_id=${CNB_BUILD_ID:-unknown}
            build_url=${CNB_BUILD_WEB_URL:-}
            source_date_epoch=$(git show -s --format=%ct "$CNB_COMMIT")

            manifest="$output_dir/release-manifest.json"
            cat >"$manifest" <<EOF
            {
              "schemaVersion": 1,
              "sourceCommit": "$CNB_COMMIT",
              "sourceOrigin": "https://github.com/jasperchen912/Vmq.git",
              "cnbRepository": "$CNB_REPO_SLUG_LOWERCASE",
              "cnbBuildId": "$build_id",
              "cnbBuildUrl": "$build_url",
              "architecture": "$architecture",
              "images": {
                "app": {
                  "ref": "$app_image",
                  "id": "$app_id",
                  "repoDigests": "$app_digest"
                },
                "h2Migrator": {
                  "ref": "$migrator_image",
                  "id": "$migrator_id",
                  "repoDigests": "$migrator_digest"
                }
              }
            }
            EOF

            images_name="vmq-images-$CNB_COMMIT-linux-arm64.tar.gz"
            docker save "$app_image" "$migrator_image" \
              | gzip -9 >"$output_dir/$images_name"
            (
              cd "$output_dir"
              sha256sum "$images_name" >"$images_name.sha256"
            )

            package_dir=$(mktemp -d)
            mkdir -p "$package_dir/deploy/ubuntu"
            cp deploy/ubuntu/compose.yaml "$package_dir/deploy/ubuntu/"
            cp deploy/ubuntu/migrate-h2-1.4-to-2.3.sh "$package_dir/deploy/ubuntu/"
            cp deploy/ubuntu/nginx-mq.conf "$package_dir/deploy/ubuntu/"
            cp deploy/ubuntu/UPGRADE.md "$package_dir/deploy/ubuntu/"
            cp "$manifest" "$package_dir/release-manifest.json"
            deploy_name="vmq-deploy-$CNB_COMMIT-linux-arm64.tar.gz"
            tar \
              --sort=name \
              --mtime="@$source_date_epoch" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$package_dir" \
              -czf "$output_dir/$deploy_name" \
              .
            (
              cd "$output_dir"
              sha256sum "$deploy_name" >"$deploy_name.sha256"
            )

        - name: upload immutable commit artifacts
          image: cnbcool/attachments:v1.1.3@sha256:60cdfb425f3361744318f5f5375ec1391cb63a9d573ea27cf71dbc4e1e5f8d33
          settings:
            commit: $CNB_COMMIT
            attachments:
              - .cnb-release-out/*.tar.gz
              - .cnb-release-out/*.sha256
              - .cnb-release-out/release-manifest.json

        - name: emit release evidence
          script: |
            set -eu
            cd .cnb-release-out
            sha256sum --check ./*.sha256
            test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 2
            printf 'CNB_RELEASE_COMMIT=%s\n' "$CNB_COMMIT"
            printf 'CNB_RELEASE_ARCHITECTURE=linux/arm64\n'
            sha256sum ./*.tar.gz
